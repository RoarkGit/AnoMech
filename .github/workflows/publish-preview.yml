name: Publish preview

on:
  push:
    branches: [distribution]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
        Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build
      run: dotnet build AnoMech/AnoMech.csproj --configuration Release

    - name: Check zip matches pluginmaster
      id: check
      run: |
        $zip = 'AnoMech/bin/Release/AnoMech/latest.zip'
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [IO.Compression.ZipFile]::OpenRead($zip)
        try {
          $entry = $archive.GetEntry('AnoMech.json')
          $reader = New-Object IO.StreamReader($entry.Open())
          $built = ($reader.ReadToEnd() | ConvertFrom-Json).AssemblyVersion
          $reader.Close()
        } finally { $archive.Dispose() }
        $repo = (Get-Content pluginmaster.json -Raw | ConvertFrom-Json)[0].AssemblyVersion
        if ($built -ne $repo) {
          throw "Built zip is $built but pluginmaster.json says $repo. Bump both together."
        }
        "version=$built" >> $env:GITHUB_OUTPUT
        "zip=$zip" >> $env:GITHUB_OUTPUT

    - name: Upload to preview release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.check.outputs.version }}
        ZIP: ${{ steps.check.outputs.zip }}
      run: |
        gh release upload preview $env:ZIP --clobber --repo $env:GITHUB_REPOSITORY
        gh release edit preview --title "AnoMech preview ($env:VERSION)" --repo $env:GITHUB_REPOSITORY
